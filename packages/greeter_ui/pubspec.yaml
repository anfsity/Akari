name: greeter_ui
description: Reusable greeter UI for Akari, free of any backend dependency.
publish_to: none

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  scene:
    path: ../scene
  theme_sdk:
    path: ../theme_sdk

dev_dependencies:
  greeter_components:
    path: ../greeter_components
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  theme_default:
    path: ../../themes/default

flutter:
  uses-material-design: true
