name: greeter
description: Compile-time themeable Flutter greeter for Akari.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dbus: ^0.7.11
  greeter_ui:
    path: packages/greeter_ui
  scene:
    path: packages/scene
  theme_sdk:
    path: packages/theme_sdk

dev_dependencies:
  flutter_lints: ^6.0.0
  yaml: ^3.1.3
  theme_default:
    path: themes/default
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
