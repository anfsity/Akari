name: greeter
description: Compile-time themeable Flutter greeter for Mozais.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dbus: ^0.7.11
  greeter_ui:
    path: packages/greeter_ui
  scene:
    path: packages/scene
  theme_catalog:
    path: packages/theme_catalog

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/
