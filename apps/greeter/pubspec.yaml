name: greeter
description: Compile-time themeable Flutter greeter for Akari.
publish_to: none
resolution: workspace
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  dbus: ^0.7.11
  greeter_ui:
    path: ../../packages/greeter_ui
  theme_sdk:
    path: ../../packages/theme_sdk

  theme_default:
    path: ../../themes/default

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
