name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Cache Linux system packages
        id: apt-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/apt-archives
          key: apt-${{ runner.os }}-${{ env.ImageVersion }}-accountsservice-clang-cmake-dbus-drm-epoxy-gtk3-lzma-seat-ninja-pkgconf-py3-systemd-utillinux-zsh

      - name: Install Linux build and test dependencies
        run: |
          cached_install_ok=false
          if [ "${{ steps.apt-cache.outputs.cache-hit }}" = "true" ] && compgen -G "$HOME/.cache/apt-archives/*.deb" >/dev/null; then
            if sudo apt-get install -y --no-install-recommends "$HOME/.cache/apt-archives"/*.deb; then
              cached_install_ok=true
            fi
          fi
          if [ "$cached_install_ok" != "true" ]; then
            mkdir -p "$HOME/.cache/apt-archives/partial"
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              -o Dir::Cache::Archives="$HOME/.cache/apt-archives" \
              -o APT::Keep-Downloaded-Packages=true \
              accountsservice \
              clang \
              cmake \
              dbus \
              libdrm-dev \
              libepoxy-dev \
              libgtk-3-dev \
              liblzma-dev \
              libseat-dev \
              ninja-build \
              pkg-config \
              python3 \
              systemd \
              util-linux \
              zsh
            sudo rm -rf "$HOME/.cache/apt-archives/lock" "$HOME/.cache/apt-archives/partial"
            sudo chown -R "$USER:$USER" "$HOME/.cache/apt-archives"
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates
          cache-directories: |
            crates/target/akari-mock
            crates/target/akari-real
            build/tool/splash
          cache-on-failure: true

      - name: Read pinned Flutter SDK version
        id: fvm
        run: |
          version="$(python3 -c 'import json; print(json.load(open(".fvmrc"))["flutter"])')"
          echo "flutter=$version" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ steps.fvm.outputs.flutter }}
          channel: stable
          cache: true

      - name: Resolve Dart Pub Workspace dependencies
        run: flutter pub get

      - name: Verify Rust, Python, Dart, Flutter, and D-Bus targets
        run: AKARI_FLUTTER_BIN="$(command -v flutter)" AKARI_DART_BIN="$(command -v dart)" dart run packages/akari_cli/bin/akari.dart verify

      - name: Build Linux debug bundle
        run: AKARI_FLUTTER_BIN="$(command -v flutter)" AKARI_DART_BIN="$(command -v dart)" dart run packages/akari_cli/bin/akari.dart build --mode debug
