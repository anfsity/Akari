name: Publish documentation snapshot
on:
  push:
    branches: [gh-pages]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: .
          include-hidden-files: true
      - name: Deploy verified snapshot
        id: deployment
        uses: actions/deploy-pages@v5.0.1
