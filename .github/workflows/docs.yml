name: Documentation

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        description: Source revision to build for a publication branch.
        required: true
        type: string

concurrency:
  group: documentation-pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs/site/package-lock.json
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Install website dependencies
        run: npm ci
        working-directory: docs/site
      - name: Generate public Dart reference
        run: AKARI_FLUTTER_BIN="$(command -v flutter)" AKARI_DART_BIN="$(command -v dart)" bash scripts/build-api-docs.sh
      - name: Check and build the handbook
        run: npm run check && npm run build && npm run verify
        working-directory: docs/site
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: docs/site/dist
          include-hidden-files: true

  publish:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/gh-pages'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified site
        id: deployment
        uses: actions/deploy-pages@v5.0.1
