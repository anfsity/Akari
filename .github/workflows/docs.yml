name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'packages/theme_sdk/**'
      - 'packages/scene/**'
      - 'packages/scene_schema/**'
      - 'packages/greeter_components/**'
      - 'scripts/build-api-docs.sh'
      - 'scripts/verify-docs.py'
      - 'dartdoc_options.yaml'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.fvmrc'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'packages/theme_sdk/**'
      - 'packages/scene/**'
      - 'packages/scene_schema/**'
      - 'packages/greeter_components/**'
      - 'scripts/build-api-docs.sh'
      - 'scripts/verify-docs.py'
      - 'dartdoc_options.yaml'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.fvmrc'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        description: Source revision to build for a publication branch.
        required: true
        type: string

concurrency:
  group: documentation-${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs/site/package-lock.json
      - name: Read pinned Flutter SDK version
        id: fvm
        run: |
          version="$(python3 -c 'import json; print(json.load(open(".fvmrc"))["flutter"])')"
          echo "flutter=$version" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ steps.fvm.outputs.flutter }}
          channel: stable
          cache: true
      - name: Install website dependencies
        run: npm ci
        working-directory: docs/site
      - name: Generate public Dart reference
        run: AKARI_FLUTTER_BIN="$(command -v flutter)" AKARI_DART_BIN="$(command -v dart)" bash scripts/build-api-docs.sh
      - name: Check and build the handbook
        run: npm run check && npm run build && npm run verify
        working-directory: docs/site
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: docs/site/dist
          include-hidden-files: true

  publish:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/gh-pages')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified site
        id: deployment
        uses: actions/deploy-pages@v5.0.1
