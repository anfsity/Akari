name: theme_default
description: Built-in default theme for the Mozais greeter.
publish_to: none

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  scene:
    path: ../../packages/scene
  greeter_components:
    path: ../../packages/greeter_components
  theme_sdk:
    path: ../../packages/theme_sdk

dev_dependencies:
  build_runner: ^2.4.13
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  scene_codegen:
    path: ../../packages/scene_codegen

flutter:
  uses-material-design: true
  assets:
    - assets/
