output * bg #15191f solid_color
default_border pixel 0
default_floating_border pixel 0
focus_follows_mouse no

# Capture physical modes and output scale from the actual standalone compositor.
exec /bin/sh -c 'swaymsg -t get_outputs -r > "$MOZAIS_LOG_DIR/outputs.json"'
exec /bin/sh -c '"${MOZAIS_APP:?}" >>"${MOZAIS_FLUTTER_LOG:?}" 2>&1; status=$?; printf "Frontend exited: %s\n" "$status" >>"$MOZAIS_LOG_DIR/lifecycle.log"; swaymsg exit >/dev/null 2>&1 || true; exit "$status"'
