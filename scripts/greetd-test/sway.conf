output * bg #15191f solid_color
default_border pixel 0
default_floating_border pixel 0
focus_follows_mouse no

# Record the effective layout before starting the frontend.
exec /bin/sh -c 'if [ -f "${MOZAIS_DISPLAY_LAYOUT:?}" ]; then python3 "${MOZAIS_DISPLAY_LAYOUT_RUNNER:?}" run "$MOZAIS_DISPLAY_LAYOUT" "${MOZAIS_APP:?}"; else swaymsg -t get_outputs -r > "$MOZAIS_LOG_DIR/outputs.json"; "${MOZAIS_APP:?}"; fi >>"${MOZAIS_FLUTTER_LOG:?}" 2>&1; status=$?; printf "Frontend exited: %s\n" "$status" >>"$MOZAIS_LOG_DIR/lifecycle.log"; swaymsg exit >/dev/null 2>&1 || true; exit "$status"'
