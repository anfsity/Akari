output * bg #15191f solid_color
default_border pixel 0
default_floating_border pixel 0
focus_follows_mouse no

# Record the effective layout before starting the frontend.
exec /bin/sh -c 'python3 "${AKARI_DISPLAY_LAYOUT_RUNNER:?}" run "${AKARI_DISPLAY_LAYOUT:?}" "${AKARI_APP:?}" >>"${AKARI_FLUTTER_LOG:?}" 2>&1; status=$?; printf "Frontend exited: %s\n" "$status" >>"$AKARI_LOG_DIR/lifecycle.log"; swaymsg exit >/dev/null 2>&1 || true; exit "$status"'
